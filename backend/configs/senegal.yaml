country: "Sénégal"
country_code: "SEN"

ui:
  primary_language: "fr"
  supported_languages: ["fr", "wo", "en"]
  script: "latin"

labor_data:
  source_file: "data/ilostat/senegal_labor_2024.json"
  currency: "XOF"
  usd_conversion_rate: 600

education_taxonomy:
  levels:
    - "aucun"
    - "primaire"
    - "BFEM"
    - "Bac"
    - "BTS"
    - "Licence"
    - "Master+"
  mapping_to_isced:
    aucun: 0
    primaire: 1
    BFEM: 2
    Bac: 3
    BTS: 5
    Licence: 6
    "Master+": 7

automation_calibration:
  source: "Frey-Osborne"
  lmic_adjustment_factor: 0.72
  rationale: >
    Sénégal has a slightly higher service-sector formalization rate than Bénin
    (Plan Sénégal Émergent PSE data), justifying a marginally higher LMIC
    adjustment factor of 0.72 vs 0.70. Still substantially below 1.0 given
    the dominance of informal and manual task composition.

opportunities:
  source_file: "data/opportunities/senegal_opportunities.json"
  types_enabled:
    - "formal_employment"
    - "self_employment"
    - "gig"
    - "training_pathway"

projections:
  source_file: "data/wittgenstein/projections_west_africa.json"
